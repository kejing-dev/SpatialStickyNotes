<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640"><title>编辑窗口</title><rect x="0" y="0" width="560" height="640" rx="28" fill="#EEF0EA" stroke="#FFFFFF" stroke-width="1" /><text x="32" y="56" font-family="PingFang SC, Inter, sans-serif" font-size="22" font-weight="600" fill="#1F2A25" text-anchor="start">新建便签</text><text x="32" y="80" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#6A756E" text-anchor="start">创建后会在你面前打开，可用标题栏拖到任意位置。</text><rect x="32" y="100" width="496" height="380" rx="20" fill="#F5E9A9" /><text x="56" y="144" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2F27" text-anchor="start">下午整理评审结论</text><text x="56" y="174" font-family="PingFang SC, Inter, sans-serif" font-size="20" font-weight="400" fill="#2B2F27" text-anchor="start">把关键决定写清楚。</text><text x="32" y="506" font-family="PingFang SC, Inter, sans-serif" font-size="13" font-weight="400" fill="#6A756E" text-anchor="start">18 / 200</text><rect x="32" y="544" width="240" height="48" rx="35" fill="#DCE4D9" /><text x="152" y="574" font-family="PingFang SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#1F2A25" text-anchor="middle">取消</text><rect x="288" y="544" width="240" height="48" rx="35" fill="#2E5F4B" /><text x="408" y="574" font-family="PingFang SC, Inter, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="middle">创建</text></svg>